name: Check Cache

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      arch:
        required: false
        type: string
      build-deps-only:
        required: false
        type: boolean
      sign-and-notarize:
        required: false
        type: boolean
      package_style:
        required: false
        type: string
      ref:
        required: false
        type: string
  
jobs:
  check_cache: # determines if there is a cache and outputs variables used in caching process
    name: Check Cache
    runs-on: ${{ inputs.os }}
    outputs:
      cache-key: ${{ steps.set_outputs.outputs.cache-key }}
      cache-path: ${{ steps.set_outputs.outputs.cache-path }}
      valid-cache: ${{ steps.cache_deps.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: 'true'
          ref: ${{ inputs.ref || github.ref }}
        
      - name: set outputs
        id: set_outputs
        env:
          # Instead of an exact match, check for characters starting with 'windows'.
          is-windows: ${{ startsWith(inputs.os, 'windows') }}
          dep-folder-name: ${{ startsWith(inputs.os, 'windows') && '/PhrozenOrca_dep' || inputs.os == 'macos-14' && '' || !startsWith(inputs.os, 'windows') && '/destdir' || '' }}
          output-cmd: ${{ startsWith(inputs.os, 'windows') && '$env:GITHUB_OUTPUT' || '"$GITHUB_OUTPUT"'}}
        run: |
          echo cache-key=${{ inputs.os }}-cache-phrozenorca_deps-build-${{ hashFiles('deps/**') }} >> ${{ env.output-cmd }}
          echo cache-path=${{ github.workspace }}/deps/build${{ env.dep-folder-name }} >> ${{ env.output-cmd }}
            
      - name: load cache
        id: cache_deps
        uses: actions/cache@v4
        with:
          path: ${{ steps.set_outputs.outputs.cache-path }}
          key: ${{ steps.set_outputs.outputs.cache-key }}
          lookup-only: true
        
  build_deps: # call next step
    name: Build Deps
    needs: [check_cache]
    uses: ./.github/workflows/build_deps.yml
    with:
      cache-key: ${{ needs.check_cache.outputs.cache-key }}
      cache-path: ${{ needs.check_cache.outputs.cache-path }}
      valid-cache: ${{ needs.check_cache.outputs.valid-cache == 'true' }}
      os: ${{ inputs.os }}
      arch: ${{ inputs.arch }}
      build-deps-only: ${{ inputs.build-deps-only }}
      sign-and-notarize: ${{ inputs.sign-and-notarize }}
      package_style: ${{ inputs.package_style }}
      ref: ${{ inputs.ref }}
    secrets: inherit
