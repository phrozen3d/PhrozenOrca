<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="max-age=7200" />
<title>Test Page</title>
<link rel="stylesheet" type="text/css" href="../css/common.css" />	
<link rel="stylesheet" type="text/css" href="../css/dark.css" />		
<link rel="stylesheet" type="text/css" href="12.css" />
<script type="text/javascript" src="../js/jquery-3.6.0.min.js"></script>
<script type="text/javascript" src="../../data/text.js"></script>	
<script type="text/javascript" src="../js/globalapi.js"></script>	
<script type="text/javascript" src="../js/common.js"></script>
<script type="text/javascript" src="12.js"></script>
</head>
<body onLoad="OnInit()">
    <!-- 模態對話框 -->
    <div id="ModalDialog">
        <!-- 標題區域 -->   
        <div id="ModalHeader">
            <div id="ModalTitle">Printer Type</div>
        </div>
        
        <!-- 內容區域 -->
        <div id="ModalContent">
            <div class="PrinterTypeOption" id="OptionFilament" onclick="SelectPrinterType('filament')">
                <div class="OptionIcon"></div>
                <div class="OptionText">Filament</div>
            </div>
            <div class="PrinterTypeOption" id="OptionResin" onclick="SelectPrinterType('resin')">
                <div class="OptionIcon"></div>
                <div class="OptionText">Resin</div>
            </div>
        </div>
        
        <!-- 按鈕區域 -->
        <div id="ModalFooter">
            <div class="NormalBtn" onclick="ConfirmSelection()">Confirm</div>
        </div>
    </div>
</body>
</html>
